<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Give online — Mercy Works Outreach</title>
  <link rel="stylesheet" href="../style.css">

<!-- This is not a page of its own. It is what the box on the Support page shows first.
     The button below has no target, on purpose: it opens Zeffy's form inside that same
     box, so the form loads from zeffy.com only when a visitor chooses to open it.
     The form's address comes from the campaign's Share dialog in Zeffy ("Embedded form").
     If the campaign changes, change the address here. -->
<body class="give-start">
  <main>
    <p class="give-start-title">Give on this page</p>
    <p>The form is provided by Zeffy, our donation platform. It loads from zeffy.com when you open it.</p>
    <p><a class="button" href="https://www.zeffy.com/embed/donation-form/support-outreach-supply-costs">Open the giving form</a></p>
  </main>
</body>
</html>
